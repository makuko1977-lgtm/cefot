# Variables reales que usa el código. Render pone PORT solo.
services:
  - type: web
    name: cefot-vxs6
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /login.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: PGSSL_NO_VERIFY
        value: "true"
