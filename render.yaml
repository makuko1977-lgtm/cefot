# Blueprint Render: New → Blueprint → este repo.
# Servicio ya existente: https://cefot-vxs6.onrender.com
services:
  - type: web
    name: cefot-vxs6
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /login.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        sync: false
