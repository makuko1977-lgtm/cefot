<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jefe de estudios · CEFOT-2</title>
<link rel="icon" href="/shared/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/shared/app.css">
<style>
  .app{max-width:920px;margin:0 auto;padding:20px 16px 72px;}
  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0;}
  @media (max-width:720px){ .stats{grid-template-columns:repeat(2,minmax(0,1fr));} }
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
  .stat .n{font-size:28px;font-weight:700;line-height:1.1;}
  .stat .l{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;margin-top:4px;}
  .filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:8px 0 4px;}
  .table-box{overflow-x:auto;max-width:100%;}
  .table-box table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;}
  .table-box th,.table-box td{
    text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);
    vertical-align:top;overflow-wrap:anywhere;word-break:break-word;
  }
  .table-box td.texto{max-width:420px;}
  .table-box th.num,.table-box td.num{width:52px;max-width:52px;text-align:right;white-space:nowrap;overflow-wrap:normal;word-break:normal;}
  .table-box th.tipo,.table-box td.tipo{width:88px;max-width:88px;white-space:nowrap;overflow-wrap:normal;word-break:normal;}
  .var{color:var(--text-dim);font-size:12px;}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="mark">JE</div>
      <div>
        <h1>Jefe de estudios</h1>
        <div class="sub">Estadísticas agregadas — sin datos personales</div>
      </div>
    </div>
    <button class="btn small ghost" id="logoutBtn" type="button">Cerrar sesión</button>
  </header>
  <div class="filtros">
    <div class="field"><label>Compañía</label>
      <select id="cia"><option value="">Todas</option><option value="1">1ª</option><option value="2">2ª</option><option value="3">3ª</option><option value="4">4ª</option></select>
    </div>
    <div class="field"><label>Sección</label>
      <select id="sec"><option value="">Todas</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select>
    </div>
    <button class="btn primary" id="verBtn" type="button">Actualizar</button>
  </div>
  <div class="stats" id="totales"></div>
  <div class="panel" style="margin-top:8px;"><h3>Sanciones por tipo y medida</h3><div id="tipos" class="table-box"></div></div>
  <div class="panel" style="margin-top:16px;"><h3>Fundamentos legales</h3><div id="fundamentos" class="table-box"></div></div>
  <div class="panel" style="margin-top:16px;"><h3>Motivos agrupados</h3>
    <p class="hint">Se juntan textos parecidos («dormido en clase» / «quedarse dormido en clase»).</p>
    <div id="motivos" class="table-box"></div></div>
  <div class="panel" style="margin-top:16px;"><h3>Por sección</h3><div id="secciones" class="table-box"></div></div>
</div>
<script>
function esc(s){
  return String(s == null ? "" : s).replace(/&/g,"\u0026amp;").replace(/</g,"\u0026lt;").replace(/>/g,"\u0026gt;");
}
fetch("/api/auth/me").then(function(r){ return r.ok ? r.json() : null; }).then(function(me){
  if (!me || !(me.jefeEstudios || me.superAdmin)) location.href = "/login.html";
}).catch(function(){ location.href = "/login.html"; });
document.getElementById("logoutBtn").onclick = function(){
  fetch("/api/auth/logout", { method: "POST" }).then(function(){ location.href = "/login.html"; });
};
function cargar(){
  var q = "?compania=" + encodeURIComponent(document.getElementById("cia").value) +
    "&seccion=" + encodeURIComponent(document.getElementById("sec").value);
  fetch("/api/estudios/estadisticas" + q).then(function(r){ if (!r.ok) throw new Error(); return r.json(); })
    .then(pintar).catch(function(){
      document.getElementById("totales").innerHTML = "<p class='form-msg error'>No se han podido cargar las estadísticas.</p>";
    });
}
function pintar(d){
  var t = d.totales || {}, med = d.sancionesPorMedida || {}, tipo = d.sancionesPorTipo || {};
  document.getElementById("totales").innerHTML =
    caja(t.refuerzos,"Refuerzos")+caja(t.rebajes,"Rebajes")+caja(t.arrestos,"Arrestos")+caja(t.sanciones,"Sanciones");
  document.getElementById("tipos").innerHTML =
    "<p><strong>Leves:</strong> "+(tipo.LEVE||0)+" · <strong>Graves:</strong> "+(tipo.GRAVE||0)+"</p>"+
    "<table><thead><tr><th>Medida</th><th class='num'>Nº</th></tr></thead><tbody>"+
    Object.keys(med).sort().map(function(k){ return "<tr><td class='texto'>"+esc(k)+"</td><td class='num'>"+med[k]+"</td></tr>"; }).join("")+
    "</tbody></table>";
  document.getElementById("fundamentos").innerHTML =
    "<table><thead><tr><th class='tipo'>Tipo</th><th>Fundamento</th><th class='num'>Nº</th></tr></thead><tbody>"+
    (d.fundamentos||[]).map(function(f){
      return "<tr><td class='tipo'>"+esc(f.tipo)+(f.letra?" ("+esc(f.letra)+")":"")+"</td><td class='texto'>"+esc(f.fundamento)+"</td><td class='num'>"+f.count+"</td></tr>";
    }).join("")+"</tbody></table>";
  document.getElementById("motivos").innerHTML =
    "<table><thead><tr><th>Grupo</th><th class='num'>Nº</th><th>Cómo se escribió</th></tr></thead><tbody>"+
    (d.motivos||[]).map(function(m){
      var vars=(m.variantes||[]).map(function(v){ return esc(v.texto)+" (×"+v.count+")"; }).join("; ");
      return "<tr><td class='texto'>"+esc(m.etiqueta)+"</td><td class='num'>"+m.count+"</td><td class='texto var'>"+vars+"</td></tr>";
    }).join("")+"</tbody></table>";
  document.getElementById("secciones").innerHTML =
    "<table><thead><tr><th>Sección</th><th class='num'>Ref.</th><th class='num'>Reb.</th><th class='num'>Arr.</th><th class='num'>San.</th></tr></thead><tbody>"+
    (d.porSeccion||[]).map(function(s){
      return "<tr><td class='texto'>"+esc(s.nombre||s.id)+"</td><td class='num'>"+s.refuerzos+"</td><td class='num'>"+s.rebajes+"</td><td class='num'>"+s.arrestos+"</td><td class='num'>"+s.sanciones+"</td></tr>";
    }).join("")+"</tbody></table>";
}
function caja(n,l){ return '<div class="stat"><div class="n">'+(n||0)+'</div><div class="l">'+esc(l)+'</div></div>'; }
document.getElementById("verBtn").onclick = cargar;
cargar();
</script>
</body>
</html>
