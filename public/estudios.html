<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jefe de estudios · CEFOT-2</title>
<link rel="icon" href="/shared/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/shared/app.css">
<style>
  body{max-width:980px;margin:0 auto;padding:24px 16px 60px;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:16px 0;}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;}
  .stat .n{font-size:26px;font-weight:700;}
  .stat .l{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top;}
  .var{color:var(--text-dim);font-size:12px;}
  .filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:12px 0;}
</style>
</head>
<body>
  <header class="top" style="margin-bottom:18px;">
    <div class="brand">
      <div class="mark">JE</div>
      <div>
        <h1>Jefe de estudios</h1>
        <div class="sub">Estadísticas agregadas — sin datos personales</div>
      </div>
    </div>
    <div><button class="btn small ghost" id="logoutBtn" type="button">Cerrar sesión</button></div>
  </header>

  <div class="filtros">
    <div class="field">
      <label>Compañía</label>
      <select id="cia">
        <option value="">Todas</option>
        <option value="1">1ª</option><option value="2">2ª</option>
        <option value="3">3ª</option><option value="4">4ª</option>
      </select>
    </div>
    <div class="field">
      <label>Sección</label>
      <select id="sec">
        <option value="">Todas</option>
        <option value="1">1</option><option value="2">2</option>
        <option value="3">3</option><option value="4">4</option><option value="5">5</option>
      </select>
    </div>
    <button class="btn primary" id="verBtn" type="button">Actualizar</button>
  </div>

  <div class="stats" id="totales"></div>

  <div class="panel" style="margin-top:16px;">
    <h3>Sanciones por tipo y medida</h3>
    <div id="tipos"></div>
  </div>
  <div class="panel" style="margin-top:16px;">
    <h3>Fundamentos legales</h3>
    <div id="fundamentos"></div>
  </div>
  <div class="panel" style="margin-top:16px;">
    <h3>Motivos agrupados</h3>
    <p class="hint">Se juntan textos que dicen lo mismo con otras palabras («dormido en clase» / «quedarse dormido en clase»; «no se ha afeitado» / «falta de policía»).</p>
    <div id="motivos"></div>
  </div>
  <div class="panel" style="margin-top:16px;">
    <h3>Por sección</h3>
    <div id="secciones"></div>
  </div>

<script>
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

fetch("/api/auth/me").then(function(r){ return r.ok?r.json():null; }).then(function(me){
  if (!me || !(me.jefeEstudios || me.superAdmin)) location.href = "/login.html";
}).catch(function(){ location.href = "/login.html"; });

document.getElementById("logoutBtn").onclick = function(){
  fetch("/api/auth/logout", { method: "POST" }).then(function(){ location.href = "/login.html"; });
};

function cargar(){
  var q = "?compania=" + encodeURIComponent(document.getElementById("cia").value) +
    "&seccion=" + encodeURIComponent(document.getElementById("sec").value);
  fetch("/api/estudios/estadisticas" + q).then(function(r){
    if (!r.ok) throw new Error();
    return r.json();
  }).then(pintar).catch(function(){
    document.getElementById("totales").innerHTML = "<p class='form-msg error'>No se han podido cargar las estadísticas.</p>";
  });
}

function pintar(d){
  var t = d.totales || {};
  document.getElementById("totales").innerHTML =
    caja(t.refuerzos, "Refuerzos") +
    caja(t.rebajes, "Rebajes") +
    caja(t.arrestos, "Arrestos") +
    caja(t.sanciones, "Sanciones");

  var med = d.sancionesPorMedida || {};
  var tipo = d.sancionesPorTipo || {};
  document.getElementById("tipos").innerHTML =
    "<p><strong>Leves:</strong> " + (tipo.LEVE||0) + " · <strong>Graves:</strong> " + (tipo.GRAVE||0) + "</p>" +
    "<table><thead><tr><th>Medida</th><th>Nº</th></tr></thead><tbody>" +
    Object.keys(med).sort().map(function(k){ return "<tr><td>"+esc(k)+"</td><td>"+med[k]+"</td></tr>"; }).join("") +
    "</tbody></table>";

  document.getElementById("fundamentos").innerHTML =
    "<table><thead><tr><th>Tipo</th><th>Fundamento</th><th>Nº</th></tr></thead><tbody>" +
    (d.fundamentos||[]).map(function(f){
      return "<tr><td>"+esc(f.tipo)+(f.letra?" ("+esc(f.letra)+")":"")+"</td><td>"+esc(f.fundamento)+"</td><td>"+f.count+"</td></tr>";
    }).join("") + "</tbody></table>";

  document.getElementById("motivos").innerHTML =
    "<table><thead><tr><th>Grupo</th><th>Nº</th><th>Cómo se escribió</th></tr></thead><tbody>" +
    (d.motivos||[]).map(function(m){
      var vars = (m.variantes||[]).map(function(v){ return esc(v.texto)+" (×"+v.count+")"; }).join("; ");
      return "<tr><td>"+esc(m.etiqueta)+"</td><td>"+m.count+"</td><td class='var'>"+vars+"</td></tr>";
    }).join("") + "</tbody></table>";

  document.getElementById("secciones").innerHTML =
    "<table><thead><tr><th>Sección</th><th>Refuerzos</th><th>Rebajes</th><th>Arrestos</th><th>Sanciones</th></tr></thead><tbody>" +
    (d.porSeccion||[]).map(function(s){
      return "<tr><td>"+esc(s.nombre||s.id)+"</td><td>"+s.refuerzos+"</td><td>"+s.rebajes+"</td><td>"+s.arrestos+"</td><td>"+s.sanciones+"</td></tr>";
    }).join("") + "</tbody></table>";
}
function caja(n,l){ return '<div class="stat"><div class="n">'+(n||0)+'</div><div class="l">'+esc(l)+'</div></div>'; }

document.getElementById("verBtn").onclick = cargar;
cargar();
</script>
</body>
</html>
