<script id="cefot2-horas-ua-js">
(function () {
  var DATA = JSON.parse(document.getElementById("cefot2-horas-ua-catalogo").textContent);
  var KEY = "cefot2_ua_fechas";
  var estado = { fase: "FFMG", moduloId: DATA.modulos[0].id, filtro: "pendientes", abiertas: {}, fechas: leer(), menu: false };

  function leer() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return {};
      var p = JSON.parse(raw), out = {}, k;
      for (k in p) if (/^\d{4}-\d{2}-\d{2}$/.test(p[k])) out[k] = p[k];
      return out;
    } catch (e) { return {}; }
  }
  function guardar() { localStorage.setItem(KEY, JSON.stringify(estado.fechas)); }
  function esc(s) {
    return String(s)
      .replace(/&/g, "&" + "amp;")
      .replace(/</g, "&" + "lt;")
      .replace(/>/g, "&" + "gt;")
      .replace(/"/g, "&" + "quot;")
      .replace(/'/g, "&" + "#39;");
  }
  function fmt(n) { return (Number.isInteger(n) ? String(n) : String(n).replace(".", ",")) + " h"; }
  function valida(v) { return !!(v && /^\d{4}-\d{2}-\d{2}$/.test(v)); }
  function partir(total) {
    var m = Math.round(total * 2), out = [];
    while (m >= 2) { out.push(1); m -= 2; }
    if (m === 1) out.push(0.5);
    return out;
  }
  function huecosUa(ua) {
    return partir(ua.horasT).map(function (h, i) { return { id: ua.id + ":T:" + (i + 1), tipo: "T", indice: i + 1, horas: h }; })
      .concat(partir(ua.horasP).map(function (h, i) { return { id: ua.id + ":P:" + (i + 1), tipo: "P", indice: i + 1, horas: h }; }));
  }
  function huecosMod(m) { return m.unidades.reduce(function (a, ud) { return a.concat(ud.uas.reduce(function (b, ua) { return b.concat(huecosUa(ua)); }, [])); }, []); }
  function resumir(hs) {
    var th = 0, dh = 0, dc = 0, i, h;
    for (i = 0; i < hs.length; i++) {
      h = hs[i]; th += h.horas;
      if (valida(estado.fechas[h.id])) { dc++; dh += h.horas; }
    }
    return { totalHuecos: hs.length, totalHoras: th, dadosHuecos: dc, dadosHoras: dh, pendientesHuecos: hs.length - dc, pendientesHoras: th - dh };
  }
  function horasMod(m) {
    var t = 0, p = 0;
    m.unidades.forEach(function (ud) { ud.uas.forEach(function (ua) { t += ua.horasT; p += ua.horasP; }); });
    return { t: t, p: p, total: t + p };
  }
  function modsFase() { return DATA.modulos.filter(function (m) { return m.fase === estado.fase; }); }
  function modulo() {
    var list = modsFase();
    return list.find(function (m) { return m.id === estado.moduloId; }) || list[0];
  }
  function metaFase() { return DATA.fases.find(function (f) { return f.id === estado.fase; }); }

  function render() {
    var list = modsFase();
    if (!list.some(function (m) { return m.id === estado.moduloId; }) && list[0]) estado.moduloId = list[0].id;
    var m = modulo();
    var meta = metaFase();
    if (Object.keys(estado.abiertas).length === 0 && m.unidades[0] && m.unidades[0].uas[0]) {
      estado.abiertas[m.unidades[0].uas[0].id] = true;
    }
    var rF = resumir(list.reduce(function (a, x) { return a.concat(huecosMod(x)); }, []));
    var rM = resumir(huecosMod(m));
    var hm = horasMod(m);
    var pct = rM.totalHoras ? Math.round((rM.dadosHoras / rM.totalHoras) * 100) : 0;
    var html = "";
    html += '<section class="card ' + (rF.pendientesHuecos ? "alarma" : "okbox") + '"><h2>' +
      (rF.pendientesHuecos ? "Alarma de horas sin impartir" : "Fase sin horas pendientes") + "</h2><p>" +
      (rF.pendientesHuecos
        ? "Fase " + meta.sigla + ": " + rF.pendientesHuecos + " huecos sin fecha (" + fmt(rF.pendientesHoras) + "). Módulo " + m.codigo + ": " + rM.pendientesHuecos + " pendientes (" + fmt(rM.pendientesHoras) + ")."
        : "Fase " + meta.sigla + ": todas las horas tienen fecha.") + "</p></section>";
    html += '<div class="tabs" role="tablist" aria-label="Fase">';
    DATA.fases.forEach(function (f) {
      html += '<button type="button" role="tab" class="' + (f.id === estado.fase ? "on" : "") + '" data-act="fase" data-id="' + f.id + '"><span class="sig">' + esc(f.sigla) + '</span><span class="sub">' + esc(f.corto) + "</span></button>";
    });
    html += "</div>";
    html += '<p class="lbl">Módulo</p><div class="mod-wrap">';
    html += '<button type="button" class="mod-btn' + (estado.menu ? " open" : "") + '" data-act="menu" aria-expanded="' + estado.menu + '" aria-label="Elegir módulo">';
    html += '<span class="ico" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>';
    html += "<span><b>" + esc(m.codigo) + '</b><span class="tit">' + esc(m.titulo) + "</span></span>";
    html += '<span class="meta"><b>' + fmt(hm.total) + '</b><span style="color:' + (rM.pendientesHuecos ? "var(--alarm)" : "var(--ok)") + '">' + (rM.pendientesHuecos ? fmt(rM.pendientesHoras) + " sin fecha" : "Completo") + "</span></span>";
    html += '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button>';
    html += '<div class="menu" ' + (estado.menu ? "" : "hidden") + ' role="listbox">';
    list.forEach(function (item) {
      var hi = horasMod(item), ri = resumir(huecosMod(item));
      html += '<button type="button" role="option" class="' + (item.id === m.id ? "on" : "") + '" data-act="mod" data-id="' + item.id + '">';
      html += '<span class="cod">' + esc(item.codigo) + "</span><span><span>" + esc(item.titulo) + '</span><span class="sub">' + fmt(hi.total) + (ri.pendientesHuecos ? " · " + fmt(ri.pendientesHoras) + " sin fecha" : " · completo") + "</span></span></button>";
    });
    html += "</div></div>";
    html += '<section class="card"><div class="head"><div><p class="lbl" style="margin:0">' + esc(meta.nombre) + "</p>";
    html += "<h2 style='color:var(--olive);margin-top:.25rem'>" + esc(m.codigo) + " · " + esc(m.titulo) + "</h2>";
    html += '<p class="nota">' + esc(m.fuente) + "</p></div>";
    html += '<dl class="stats"><div><dt>Teóricas</dt><dd>' + fmt(hm.t) + "</dd></div><div><dt>Prácticas</dt><dd>" + fmt(hm.p) + "</dd></div><div><dt>Ficha</dt><dd>" + fmt(m.horasFicha) + "</dd></div></dl></div>";
    html += '<p class="pct"><span>Impartidas ' + fmt(rM.dadosHoras) + " de " + fmt(rM.totalHoras) + "</span><span>" + pct + " %</span></p>";
    html += '<div class="bar' + (pct === 100 ? " full" : "") + '"><i style="width:' + pct + '%"></i></div>';
    html += '<div class="row"><div class="filt" role="group" aria-label="Filtro">';
    [["pendientes","Pendientes"],["impartidas","Impartidas"],["todas","Todas"]].forEach(function (x) {
      html += '<button type="button" class="' + (estado.filtro === x[0] ? "on" : "") + '" data-act="filtro" data-id="' + x[0] + '">' + x[1] + "</button>";
    });
    html += '</div><div><button type="button" class="ghost" data-act="export">Exportar</button> <button type="button" class="ghost" data-act="vaciar">Vaciar</button></div></div>';
    var bloques = 0;
    m.unidades.forEach(function (ud) {
      var vis = ud.uas.filter(function (ua) {
        if (estado.filtro === "todas") return true;
        var r = resumir(huecosUa(ua));
        return estado.filtro === "pendientes" ? r.pendientesHuecos > 0 : r.dadosHuecos > 0;
      });
      if (!vis.length) return;
      bloques++;
      var rUd = resumir(ud.uas.reduce(function (a, ua) { return a.concat(huecosUa(ua)); }, []));
      html += '<article class="ud"><header><h3>' + esc(ud.codigo) + " · " + esc(ud.titulo) + "</h3><p>" + (rUd.pendientesHuecos ? rUd.pendientesHuecos + " huecos sin fecha" : "Unidad completa") + "</p></header>";
      vis.forEach(function (ua) {
        var hs = huecosUa(ua), r = resumir(hs), open = !!estado.abiertas[ua.id];
        html += '<button type="button" class="ua' + (open ? " open" : "") + '" data-act="ua" data-id="' + ua.id + '" aria-expanded="' + open + '">';
        html += '<span class="code">' + esc(ua.codigo) + "</span> ";
        html += r.pendientesHuecos ? '<span class="tag a">' + r.pendientesHuecos + " sin fecha</span>" : '<span class="tag o">Completa</span>';
        html += "<div>" + esc(ua.titulo) + '</div><div class="muted" style="font-size:.75rem">T ' + fmt(ua.horasT) + " · P " + fmt(ua.horasP) + " · " + r.dadosHuecos + "/" + r.totalHuecos + " huecos fechados</div></button>";
        html += '<div class="slots">';
        if (ua.nota) html += '<p class="nota">' + esc(ua.nota) + "</p>";
        html += '<div class="lote"><label>Misma fecha para huecos de esta UA<input type="date" data-lote="' + ua.id + '"></label>';
        html += '<button type="button" class="pri" data-act="aplicar" data-id="' + ua.id + '">Aplicar a pendientes</button>';
        html += '<button type="button" class="ghost" data-act="quitar" data-id="' + ua.id + '">Quitar fechas</button></div>';
        if (!hs.length) html += '<p class="muted">Esta unidad no tiene horas lectivas.</p>';
        else {
          html += '<div class="grid">';
          hs.forEach(function (h) {
            var ok = valida(estado.fechas[h.id]);
            html += '<label class="hueco' + (ok ? " ok" : "") + '"><span>' + (h.tipo === "T" ? "Teórica" : "Práctica") + " " + h.indice + " (" + fmt(h.horas) + ")</span>";
            html += '<input type="date" data-hueco="' + h.id + '" value="' + (estado.fechas[h.id] || "") + '"></label>';
          });
          html += "</div>";
        }
        html += "</div>";
      });
      html += "</article>";
    });
    if (!bloques) {
      html += '<p class="empty">' + (estado.filtro === "impartidas" ? "Ninguna unidad tiene horas fechadas en este módulo." : estado.filtro === "pendientes" ? "No quedan horas pendientes en este módulo." : "Este módulo no tiene unidades.") + "</p>";
    }
    html += "</section>";
    html += '<section class="card"><button type="button" class="ua" data-act="notas" style="border:0">' + (estado.notas ? "▾" : "▸") + " Criterios de esta prueba</button>";
    if (estado.notas) {
      html += "<ul class='muted' style='font-size:.9rem'>";
      DATA.notas.forEach(function (n) { html += "<li>" + esc(n) + "</li>"; });
      html += "</ul>";
    }
    html += "</section>";
    html += '<footer class="pie">CEFOT-2 · horas por UA · almacenamiento local · archivo listo para implantar en seccion3.html</footer>';
    document.getElementById("app").innerHTML = html;
  }

  document.getElementById("app").addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-act]");
    if (!t) {
      if (!ev.target.closest(".mod-wrap")) { estado.menu = false; render(); }
      return;
    }
    var act = t.getAttribute("data-act"), id = t.getAttribute("data-id");
    if (act === "fase") { estado.fase = id; estado.menu = false; estado.moduloId = (modsFase()[0] || {}).id; estado.abiertas = {}; }
    else if (act === "menu") { estado.menu = !estado.menu; }
    else if (act === "mod") { estado.moduloId = id; estado.menu = false; estado.abiertas = {}; }
    else if (act === "filtro") { estado.filtro = id; }
    else if (act === "ua") { estado.abiertas[id] = !estado.abiertas[id]; }
    else if (act === "notas") { estado.notas = !estado.notas; }
    else if (act === "aplicar") {
      var fecha = document.querySelector('[data-lote="' + id + '"]').value;
      if (!valida(fecha)) return;
      var ua = null;
      modulo().unidades.forEach(function (ud) { ud.uas.forEach(function (u) { if (u.id === id) ua = u; }); });
      if (!ua) return;
      huecosUa(ua).forEach(function (h) { if (!valida(estado.fechas[h.id])) estado.fechas[h.id] = fecha; });
      guardar();
    } else if (act === "quitar") {
      var ua2 = null;
      modulo().unidades.forEach(function (ud) { ud.uas.forEach(function (u) { if (u.id === id) ua2 = u; }); });
      if (!ua2) return;
      huecosUa(ua2).forEach(function (h) { delete estado.fechas[h.id]; });
      guardar();
    } else if (act === "export") {
      var blob = new Blob([JSON.stringify({ version: DATA.version, fechas: estado.fechas }, null, 2)], { type: "application/json" });
      var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "cefot2-horas-ua.json"; a.click();
      return;
    } else if (act === "vaciar") {
      if (!confirm("¿Borrar todas las fechas de horas?")) return;
      estado.fechas = {}; guardar();
    }
    render();
  });
  document.getElementById("app").addEventListener("change", function (ev) {
    var h = ev.target.getAttribute("data-hueco");
    if (!h) return;
    if (ev.target.value) estado.fechas[h] = ev.target.value; else delete estado.fechas[h];
    guardar(); render();
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && estado.menu) { estado.menu = false; render(); }
  });
  render();
})();
</script>
</body>
</html>
