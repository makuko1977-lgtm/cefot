<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso · CEFOT-2 BAL/3ª CÍA</title>
<meta name="theme-color" content="#1f7a3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CEFOT">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/shared/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/shared/icon.svg">
<link rel="stylesheet" href="/shared/app.css">
<style>
  .login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
  .login-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:36px 32px;box-shadow:var(--shadow);}
  .login-card .mark{width:52px;height:52px;border-radius:12px;background:linear-gradient(150deg,var(--accent-bright) 0%,var(--accent) 55%,#345c34 100%);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:700;font-size:16px;color:#0e150f;margin:0 auto 18px;box-shadow:var(--shadow);}
  .login-card h1{font-family:var(--font-display);text-align:center;font-size:19px;margin:0 0 4px;}
  .login-card .sub{text-align:center;font-size:12.5px;color:var(--text-dim);margin-bottom:26px;}
  .login-card .field{margin-bottom:16px;}
  .login-card .btn.primary{width:100%;padding:11px;font-size:14px;margin-top:6px;}
  .login-msg{min-height:18px;font-size:13px;margin-top:12px;text-align:center;}
  .install-hint{margin-top:18px;font-size:12px;color:var(--text-dim);text-align:center;line-height:1.45;}
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-card corner-accent">
    <div class="mark">S·3</div>
    <h1>CEFOT-2 · BAL/3ª CÍA</h1>
    <div class="sub">Gestión de personal — acceso restringido</div>

    <form id="loginForm">
      <div class="field">
        <label for="loginDni">Usuario</label>
        <input type="text" id="loginDni" autocomplete="username" autocapitalize="characters" placeholder="El identificador que te asignaron" required>
      </div>
      <div class="field">
        <label for="loginPassword">Contraseña</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn primary">Entrar</button>
      <div class="login-msg form-msg" id="loginMsg"></div>
    </form>
    <div class="install-hint">En el iPhone: Safari → Compartir → <strong>Añadir a pantalla de inicio</strong> para usarla como app.</div>
  </div>
</div>

<script src="/shared/pwa.js"></script>
<script>
  var form = document.getElementById("loginForm");
  var msg = document.getElementById("loginMsg");

  function destinoTrasLogin(me){
    if (me.superAdmin) return "/superadmin.html";
    if (me.capitanCompania && !(me.tenant && me.tenant.role === "admin")) return "/capitan.html";
    if (me.tenant && me.tenant.role === "admin") return "/admin.html";
    return "/instructor.html";
  }

  fetch("/api/auth/me").then(function(r){ return r.ok ? r.json() : null; }).then(function(me){
    if (me) location.href = destinoTrasLogin(me);
  }).catch(function(){});

  form.addEventListener("submit", function(e){
    e.preventDefault();
    msg.textContent = "";
    msg.className = "login-msg form-msg";
    fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        dni: document.getElementById("loginDni").value,
        password: document.getElementById("loginPassword").value
      })
    }).then(function(r){ return r.json().then(function(data){ return { ok: r.ok, data: data }; }); })
      .then(function(res){
        if (!res.ok){
          msg.textContent = res.data.error || "No se ha podido iniciar sesión.";
          msg.className = "login-msg form-msg error";
          return;
        }
        if (res.data.superAdmin) location.href = "/superadmin.html";
        else if (res.data.capitanCompania && !res.data.tenantId) location.href = "/capitan.html";
        else location.href = res.data.role === "admin" ? "/admin.html" : "/instructor.html";
      })
      .catch(function(){
        msg.textContent = "Error de conexión con el servidor.";
        msg.className = "login-msg form-msg error";
      });
  });
</script>

</body>
</html>
