<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capitan de Compania · CEFOT-2</title>
<link rel="stylesheet" href="/shared/app.css">
<style>
  .grid-secciones{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:6px;}
  .seccion-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .seccion-card.vacia{opacity:.55;}
  .seccion-card .cia{font-family:var(--font-mono);font-size:11px;letter-spacing:.5px;color:var(--text-dim);text-transform:uppercase;margin-bottom:4px;}
  .seccion-card h4{margin:0 0 6px;font-family:var(--font-display);font-size:16px;}
  .seccion-card .jefe{font-size:12.5px;color:var(--text-dim);}
  .seccion-card .mini-stats{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .seccion-card .mini-stat{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);background:var(--panel-2);border-radius:6px;padding:2px 6px;}
  .seccion-card .form-actions{margin-top:12px;}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="mark">CC</div>
      <div>
        <h1>CEFOT-2 · Capitan de Compania</h1>
        <div class="sub" id="companiaSub">Elige la seccion en la que quieres actuar</div>
      </div>
    </div>
    <div id="topActions" style="display:flex;gap:8px;align-items:center;"></div>
  </header>
  <div class="panel corner-accent" style="margin-bottom:22px;">
    <h3>Mi contrasena</h3>
    <div class="panel-sub">Cambia la contrasena de tu cuenta de capitan.</div>
    <div class="field-grid">
      <div class="field"><label for="miPasswordInput">Nueva contrasena</label><input type="text" id="miPasswordInput" placeholder="Minimo 6 caracteres"></div>
      <div class="field"><label for="miPasswordConfirmInput">Repite la nueva contrasena</label><input type="text" id="miPasswordConfirmInput" placeholder="Repite la contrasena"></div>
    </div>
    <div class="form-actions">
      <button class="btn primary" id="miPasswordSaveBtn" type="button">Guardar contrasena</button>
      <span class="form-msg" id="miPasswordMsg"></span>
    </div>
  </div>
  <div class="panel corner-accent">
    <h3>Secciones de mi compania</h3>
    <div class="panel-sub">Entra en una seccion. Para volver aqui sin cerrar sesion usa Volver a compania.</div>
    <div class="grid-secciones" id="seccionesGrid"></div>
  </div>
</div>
<script>
(function(){
  var grid = document.getElementById("seccionesGrid");
  var topActions = document.getElementById("topActions");
  var sub = document.getElementById("companiaSub");

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g, "\u0026amp;")
      .replace(/</g, "\u0026lt;")
      .replace(/>/g, "\u0026gt;")
      .replace(/"/g, "\u0026quot;");
  }

  function pintar(secciones){
    var html = "";
    (secciones || []).forEach(function(s){
      if (s.existe){
        html += '<div class="seccion-card"><div class="cia">Seccion ' + s.seccion + '</div><h4>'
          + esc(s.nombre) + '</h4><div class="jefe">Jefe de seccion: '
          + esc(s.jefeSeccion ? s.jefeSeccion.nombre : "-") + '</div><div class="mini-stats"><span class="mini-stat">'
          + s.totales.alumnos + ' alumnos</span><span class="mini-stat">'
          + s.totales.sanciones + ' sanciones</span></div><div class="form-actions">'
          + '<button class="btn primary small entrar-btn" type="button" data-id="' + s.id + '">Entrar</button></div></div>';
      } else {
        html += '<div class="seccion-card vacia"><div class="cia">Seccion ' + s.seccion
          + '</div><h4>Sin crear</h4><div class="jefe">Todavia no tiene jefe de seccion</div></div>';
      }
    });
    grid.innerHTML = html || '<div class="empty-state">No hay secciones.</div>';
    grid.querySelectorAll(".entrar-btn").forEach(function(btn){
      btn.onclick = function(){
        btn.disabled = true;
        fetch("/api/capitan/secciones/" + encodeURIComponent(btn.getAttribute("data-id")) + "/entrar", { method: "POST" })
          .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); })
          .then(function(res){
            if (!res.ok){ btn.disabled = false; alert(res.d.error || "No se pudo entrar"); return; }
            location.href = "/seccion3.html";
          }).catch(function(){ btn.disabled = false; alert("Error de conexion"); });
      };
    });
  }

  document.getElementById("miPasswordSaveBtn").onclick = function(){
    var p = document.getElementById("miPasswordInput").value;
    var c = document.getElementById("miPasswordConfirmInput").value;
    var msg = document.getElementById("miPasswordMsg");
    if (p.length < 6 || p !== c){ msg.textContent = "Revisa la contrasena (minimo 6 y que coincidan)."; msg.className = "form-msg error"; return; }
    fetch("/api/capitan/mi-password", { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: p }) })
      .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); })
      .then(function(res){ msg.textContent = res.ok ? "Guardada." : (res.d.error || "Error"); msg.className = "form-msg " + (res.ok ? "ok" : "error"); });
  };

  fetch("/api/auth/me").then(function(r){ return r.ok ? r.json() : null; }).then(function(me){
    if (!me){ location.href = "/login.html"; return; }
    if (!me.capitanCompania){
      if (me.superAdmin) location.href = "/superadmin.html";
      else if (me.tenant && me.tenant.role === "admin") location.href = "/seccion3.html";
      else location.href = "/instructor.html";
      return;
    }
    topActions.innerHTML = '<span class="meta-note">' + esc(me.nombre) + ' (' + esc(me.dni) + ')</span>'
      + '<button class="btn small ghost" id="logoutBtn">Cerrar sesion</button>';
    document.getElementById("logoutBtn").onclick = function(){
      fetch("/api/auth/logout", { method: "POST" }).then(function(){ location.href = "/login.html"; });
    };
    fetch("/api/capitan/secciones").then(function(r){
      if (!r.ok) throw new Error("fail");
      return r.json();
    }).then(function(data){
      sub.textContent = "Capitan de la " + data.compania + "a Compania — elige seccion";
      pintar(data.secciones || []);
    }).catch(function(){
      grid.innerHTML = '<div class="empty-state">No se han podido cargar las secciones. Recarga.</div>';
    });
  }).catch(function(){ location.href = "/login.html"; });
})();
</script>
</body>
</html>
