<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jefes de pelotón · CEFOT-2</title>
<link rel="icon" href="/shared/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/shared/app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="mark">S</div>
      <div>
        <h1>Jefes de pelotón</h1>
        <div class="sub">Solo el jefe de sección puede crear estas cuentas</div>
      </div>
    </div>
    <div>
      <a class="btn small ghost" href="/seccion.html">Volver a gestión</a>
      <a class="btn small ghost" href="/login.html">Cerrar sesión</a>
    </div>
  </header>

  <div class="panel corner-accent">
    <h3>Alta de jefe de pelotón</h3>
    <div class="panel-sub">Usuario sin espacios. Al entrar irá a la pantalla de instructor, no a la gestión completa.</div>
    <div class="field-grid">
      <div class="field"><label>Usuario</label><input id="uDni" type="text" autocapitalize="characters" placeholder="PELOTON1"></div>
      <div class="field"><label>Nombre</label><input id="uNombre" type="text"></div>
      <div class="field"><label>Contraseña</label><input id="uPass" type="text" placeholder="Mínimo 6 caracteres"></div>
    </div>
    <div class="field-grid" style="margin-top:8px;">
      <label><input type="checkbox" id="pFotos" checked> Fotos</label>
      <label><input type="checkbox" id="pFicha" checked> Ver ficha</label>
      <label><input type="checkbox" id="pAdj" checked> Adjuntos</label>
      <label><input type="checkbox" id="pReb" checked> Ver rebajes/refuerzos</label>
    </div>
    <div class="form-actions" style="margin-top:14px;">
      <button class="btn primary" type="button" id="uSave">Dar de alta</button>
      <span class="form-msg" id="uMsg"></span>
    </div>
  </div>

  <div class="panel">
    <h3>Cuentas de esta sección</h3>
    <div id="uLista" class="hint">Cargando…</div>
  </div>
</div>
<script>
function permisos(){
  return {
    fotos: document.getElementById("pFotos").checked,
    verFicha: document.getElementById("pFicha").checked,
    adjuntos: document.getElementById("pAdj").checked,
    verRebajesRefuerzos: document.getElementById("pReb").checked
  };
}
function cargar(){
  fetch("/api/admin/usuarios").then(function(r){
    if (r.status === 401 || r.status === 403){
      location.href = "/login.html";
      return { usuarios: [] };
    }
    return r.ok ? r.json() : { usuarios: [] };
  }).then(function(d){
    var list = (d && d.usuarios) || [];
    var el = document.getElementById("uLista");
    if (!list.length){ el.textContent = "Todavía no hay jefes de pelotón."; return; }
    el.innerHTML = list.map(function(u){
      return "<div style='display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);'>" +
        "<div><strong>" + u.nombre + "</strong> · " + u.dni + "</div>" +
        "<button type='button' class='btn small ghost u-del' data-dni='" + u.dni + "'>Quitar</button></div>";
    }).join("");
    document.querySelectorAll(".u-del").forEach(function(btn){
      btn.onclick = function(){
        if (!confirm("¿Quitar a " + btn.getAttribute("data-dni") + "?")) return;
        fetch("/api/admin/usuarios/" + encodeURIComponent(btn.getAttribute("data-dni")), { method: "DELETE" })
          .then(function(){ cargar(); });
      };
    });
  });
}
document.getElementById("uSave").onclick = function(){
  var msg = document.getElementById("uMsg");
  fetch("/api/admin/usuarios", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      dni: document.getElementById("uDni").value,
      nombre: document.getElementById("uNombre").value,
      password: document.getElementById("uPass").value,
      permisos: permisos()
    })
  }).then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); })
    .then(function(res){
      msg.textContent = res.ok ? "Guardado." : (res.d.error || "No se pudo guardar.");
      msg.className = "form-msg " + (res.ok ? "ok" : "error");
      if (res.ok){
        document.getElementById("uDni").value = "";
        document.getElementById("uNombre").value = "";
        document.getElementById("uPass").value = "";
        cargar();
      }
    });
};
cargar();
</script>
</body>
</html>
